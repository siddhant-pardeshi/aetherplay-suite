org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 defaults to built-in Kotlin; we pin one external Kotlin toolchain (2.4.21)
# across app/library/JVM modules for deterministic compiler + Compose plugin parity.
# Documented opt-out path (removed in AGP 10): see docs/ARCHITECTURE.md
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
