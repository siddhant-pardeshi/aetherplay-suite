name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK pieces not on the runner image
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: ./gradlew :core:model:test :engine:search:test --stacktrace

      - name: Build debug APKs
        run: ./gradlew :apps:lab:assembleDebug :apps:space:assembleDebug --stacktrace

      - name: Upload Lab APK
        uses: actions/upload-artifact@v4
        with:
          name: aetherplay-lab-debug
          path: apps/lab/build/outputs/apk/debug/*.apk

      - name: Upload Space APK
        uses: actions/upload-artifact@v4
        with:
          name: aetherplay-space-debug
          path: apps/space/build/outputs/apk/debug/*.apk
