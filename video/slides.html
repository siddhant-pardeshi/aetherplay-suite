<!DOCTYPE html>

<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  .wrap { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 140px; }
  .kicker { font-size:26px; letter-spacing:10px; color:#65E3BE; font-weight:600; margin-bottom:26px; }
  .kicker.v { color:#B5A1FF; }
  h1 { font-size:110px; font-weight:700; line-height:1.06; letter-spacing:-2px; }
  h2 { font-size:76px; font-weight:700; line-height:1.1; letter-spacing:-1px; margin-bottom:30px; }
  .sub { font-size:34px; color:#A8B3C4; line-height:1.5; max-width:1250px; margin-top:30px; }
  .row { display:flex; gap:36px; margin-top:60px; }
  .card { background:rgba(20,25,35,.85); border:1px solid rgba(42,52,68,.9); border-radius:24px; padding:40px 44px; flex:1; }
  .card h3 { font-size:38px; margin-bottom:8px; }
  .card .tag { font-size:22px; letter-spacing:4px; font-weight:600; margin-bottom:18px; }
  .mint { color:#65E3BE; } .violet { color:#B5A1FF; }
  .card ul { list-style:none; margin-top:16px; }
  .card li { font-size:26px; color:#A8B3C4; line-height:1.75; padding-left:30px; position:relative; }
  .card li::before { content:''; position:absolute; left:0; top:16px; width:10px; height:10px; border-radius:3px; background:currentColor; opacity:.9; }
  .card.mintc li::before { background:#65E3BE; } .card.violetc li::before { background:#B5A1FF; }
  .diamond { width:64px; height:64px; transform:rotate(45deg); border-radius:14px; margin-bottom:34px; }
  .diamond.m { background:linear-gradient(135deg,#65E3BE,#3EC9C4); }
  .diamond.v { background:linear-gradient(135deg,#B5A1FF,#7F9BFF); }
  .steps { counter-reset:st; margin-top:50px; }
  .steps div { font-size:32px; color:#D7DEE9; line-height:2.05; }
  .steps div::before { counter-increment:st; content:counter(st); display:inline-block; width:52px; height:52px; line-height:52px; text-align:center;
    border-radius:14px; background:linear-gradient(135deg,#65E3BE,#3EC9C4); color:#04241B; font-weight:700; margin-right:26px; font-size:26px; }
  .code { background:#07080C; border:1px solid #2A3444; border-radius:16px; padding:34px 40px; font-family:Consolas,Menlo,monospace;
    font-size:30px; color:#9FE8D4; line-height:1.9; margin-top:50px; width:fit-content; }
  .code .p { color:#A8B3C4; } .code .c { color:#5A6577; }
  .pill { display:inline-block; border-radius:999px; padding:10px 26px; font-size:24px; font-weight:600; letter-spacing:1px; margin-right:16px; }
  .pill.ok { background:rgba(101,227,190,.14); color:#65E3BE; border:1px solid rgba(101,227,190,.45); }
  .pill.warn { background:rgba(240,191,112,.12); color:#F0BF70; border:1px solid rgba(240,191,112,.45); }
  .pill.no { background:rgba(255,133,133,.12); color:#FF8585; border:1px solid rgba(255,133,133,.45); }
  .phone { width:400px; height:800px; border-radius:48px; border:2px solid #2A3444; background:#07080C; position:relative; overflow:hidden; flex-shrink:0; }
  .phone .notch { width:150px; height:26px; background:#1D2532; border-radius:0 0 16px 16px; margin:0 auto; }
  .phone .hud { display:flex; justify-content:space-between; padding:26px 30px; font-family:Consolas,monospace; font-size:24px; }
  .phone .energy { height:10px; border-radius:6px; background:#1D2532; margin:6px 30px; overflow:hidden; }
  .phone .energy i { display:block; height:100%; width:70%; background:linear-gradient(90deg,#65E3BE,#3EC9C4); }
  .cr { position:absolute; width:44px; height:44px; transform:rotate(45deg); border-radius:9px; }
  .note { position:absolute; bottom:52px; left:140px; right:140px; font-size:22px; color:#5A6577; letter-spacing:2px; }
  .big { font-size:170px; font-weight:800; letter-spacing:-4px; }
  .mono { font-family:Consolas,Menlo,monospace; }
  .two { display:flex; gap:80px; align-items:center; }
  .grow { flex:1; }
  .footer-brand { position:absolute; top:64px; right:140px; font-size:24px; letter-spacing:8px; color:#A8B3C4; font-weight:600; }
</style>
