<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Lab and Space connected by the signature-guarded bridge">
  <defs>
    <linearGradient id="hm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#65E3BE"/>
      <stop offset="100%" stop-color="#B5A1FF"/>
    </linearGradient>
    <linearGradient id="mint2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#65E3BE"/>
      <stop offset="100%" stop-color="#3EC9C4"/>
    </linearGradient>
    <linearGradient id="violet2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B5A1FF"/>
      <stop offset="100%" stop-color="#7F9BFF"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="190" rx="20" fill="#0B0D12"/>
  <rect x="1" y="1" width="998" height="188" rx="19" fill="none" stroke="#2A3444" stroke-width="1.5"/>

  <!-- LAB node -->
  <g transform="translate(130 95)">
    <path d="M0 -40 L30 0 L0 40 L-30 0 Z" fill="url(#mint2)"/>
    <circle r="52" fill="none" stroke="#65E3BE" stroke-opacity="0.4" stroke-width="1.5">
      <animate attributeName="r" values="44; 60; 44" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.45; 0; 0.45" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text y="74" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#F2F5FA">AetherPlay Lab</text>
    <text y="94" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#A8B3C4">the instrument</text>
  </g>

  <!-- SPACE node -->
  <g transform="translate(870 95)">
    <path d="M0 -40 L30 0 L0 40 L-30 0 Z" fill="url(#violet2)"/>
    <circle r="52" fill="none" stroke="#B5A1FF" stroke-opacity="0.4" stroke-width="1.5">
      <animate attributeName="r" values="44; 60; 44" dur="3.4s" repeatCount="indefinite" begin="1.7s"/>
      <animate attributeName="stroke-opacity" values="0.45; 0; 0.45" dur="3.4s" repeatCount="indefinite" begin="1.7s"/>
    </circle>
    <text y="74" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#F2F5FA">AetherPlay Space</text>
    <text y="94" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" fill="#A8B3C4">the stage</text>
  </g>

  <!-- bridge line with flowing dashes -->
  <line x1="185" y1="95" x2="815" y2="95" stroke="url(#hm)" stroke-width="2" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" values="0; -96" dur="2.4s" repeatCount="indefinite"/>
  </line>

  <!-- traveling packets -->
  <circle r="5" fill="#65E3BE">
    <animateMotion path="M185 95 L815 95" dur="2.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#B5A1FF">
    <animateMotion path="M815 95 L185 95" dur="2.4s" repeatCount="indefinite" begin="1.2s" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="2.4s" repeatCount="indefinite" begin="1.2s"/>
  </circle>

  <text x="500" y="70" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" fill="#A8B3C4">signature-guarded AIDL bridge · protocol 1.0</text>
  <text x="500" y="126" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#65E3BE">handshake → search → refine → preview → commit → undo → freeze</text>
</svg>
