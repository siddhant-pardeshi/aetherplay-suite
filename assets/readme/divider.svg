<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="26" viewBox="0 0 1000 26" role="img" aria-label="Aurora divider">
  <defs>
    <linearGradient id="dv" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B0D12"/>
      <stop offset="30%" stop-color="#65E3BE" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#B5A1FF" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#65E3BE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0B0D12"/>
    </linearGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2F5FA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F2F5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F2F5FA" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1000" height="2" rx="1" fill="url(#dv)"/>
  <circle cy="12" r="4" fill="#F2F5FA">
    <animate attributeName="cx" values="20; 980; 20" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2; 1; 0.2" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
