<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="AetherPlay Suite — Lab and Space">
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#65E3BE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#65E3BE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B5A1FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#B5A1FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3EC9C4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#3EC9C4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#65E3BE"/>
      <stop offset="100%" stop-color="#3EC9C4"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B5A1FF"/>
      <stop offset="100%" stop-color="#7F9BFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F2F5FA" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F2F5FA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F2F5FA" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="#0B0D12"/>
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="none" stroke="#2A3444" stroke-width="1.5"/>

  <!-- drifting aurora blobs -->
  <circle cx="240" cy="90" r="300" fill="url(#g1)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 90 40; 0 0" dur="26s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="120" r="320" fill="url(#g2)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -80 50; 0 0" dur="32s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="360" r="340" fill="url(#g3)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 60 -60; 0 0" dur="38s" repeatCount="indefinite"/>
  </circle>

  <!-- Lab diamond -->
  <g transform="translate(285 168)">
    <animateTransform attributeName="transform" type="translate" values="285 168; 285 160; 285 168" dur="5.5s" repeatCount="indefinite" additive="replace"/>
    <path d="M0 -46 L34 0 L0 46 L-34 0 Z" fill="url(#mint)"/>
    <path d="M-15 0 L0 -15 L15 0 L0 15 Z" fill="#0B0D12" opacity="0.45"/>
    <circle r="64" fill="none" stroke="#65E3BE" stroke-opacity="0.35" stroke-width="1.5">
      <animate attributeName="r" values="52; 72; 52" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.4; 0.05; 0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Space diamond -->
  <g transform="translate(390 168)">
    <animateTransform attributeName="transform" type="translate" values="390 168; 390 176; 390 168" dur="6.5s" repeatCount="indefinite" additive="replace"/>
    <path d="M0 -46 L34 0 L0 46 L-34 0 Z" fill="url(#violet)"/>
    <path d="M-15 0 L0 -15 L15 0 L0 15 Z" fill="#0B0D12" opacity="0.45"/>
    <circle r="64" fill="none" stroke="#B5A1FF" stroke-opacity="0.35" stroke-width="1.5">
      <animate attributeName="r" values="52; 72; 52" dur="4s" repeatCount="indefinite" begin="1.3s"/>
      <animate attributeName="stroke-opacity" values="0.4; 0.05; 0.4" dur="4s" repeatCount="indefinite" begin="1.3s"/>
    </circle>
  </g>

  <!-- wordmark -->
  <text x="470" y="178" font-family="'Segoe UI', 'SF Pro Display', system-ui, sans-serif" font-size="64" font-weight="700" fill="#F2F5FA" letter-spacing="1">AetherPlay</text>
  <text x="472" y="216" font-family="'Segoe UI', 'SF Pro Display', system-ui, sans-serif" font-size="22" fill="#A8B3C4" letter-spacing="7">LAB  ·  SPACE</text>

  <!-- animated shine under wordmark -->
  <rect x="470" y="238" width="520" height="2.5" fill="#2A3444"/>
  <rect x="-160" y="234" width="160" height="10" fill="url(#shine)">
    <animate attributeName="x" values="-160; 1030" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <!-- twinkles -->
  <g fill="#F2F5FA">
    <path d="M180 60 l2.6 7.4 7.4 2.6 -7.4 2.6 -2.6 7.4 -2.6 -7.4 -7.4 -2.6 7.4 -2.6 z">
      <animate attributeName="opacity" values="0.9; 0.15; 0.9" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M1050 250 l2.2 6.2 6.2 2.2 -6.2 2.2 -2.2 6.2 -2.2 -6.2 -6.2 -2.2 6.2 -2.2 z">
      <animate attributeName="opacity" values="0.2; 0.95; 0.2" dur="4.2s" repeatCount="indefinite"/>
    </path>
    <path d="M560 62 l1.8 5 5 1.8 -5 1.8 -1.8 5 -1.8 -5 -5 -1.8 5 -1.8 z">
      <animate attributeName="opacity" values="0.8; 0.1; 0.8" dur="3.7s" repeatCount="indefinite" begin="0.8s"/>
    </path>
    <path d="M900 78 l1.8 5 5 1.8 -5 1.8 -1.8 5 -1.8 -5 -5 -1.8 5 -1.8 z">
      <animate attributeName="opacity" values="0.15; 0.85; 0.15" dur="2.9s" repeatCount="indefinite" begin="1.5s"/>
    </path>
  </g>
</svg>
